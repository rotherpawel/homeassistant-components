blueprint:
  name: IKEA STYRBAR E2313 — lampki z barwą i natężeniem (Zigbee2MQTT)
  description: >
    Sterowanie dowolnymi lampkami, które w Home Assistant obsługują natężenie
    i barwę, pilotem STYRBAR E2313 spiętym przez Zigbee2MQTT.
    Dotyczy to KAJPLATS i każdej innej lampki albo grupy z trybem
    color_temp, hs, xy lub rgb. Akcje to zwykłe light.turn_on / light.turn_off.

    Pilot nie publikuje encji akcji. Automatyzacja nasłuchuje wyzwalaczy
    urządzenia MQTT typu action (payloady on, off, brightness_move_up,
    brightness_move_down, brightness_stop, arrow_left_click, arrow_right_click).

    Krótkie kliknięcie ON włącza lampki, OFF je wyłącza.
    Przytrzymanie ON podnosi natężenie, przytrzymanie OFF je obniża,
    aż do puszczenia przycisku (brightness_stop).
    Prawy przycisk, gdy lampka ma i kolor, i temperaturę barwową, przełącza
    czerwony (HS 0/100) → biały ciepły (2600 K) → biały neutralny (3800 K).
    Lewy i prawy przycisk zmieniają barwę tylko wtedy, gdy lampa wzorcowa jest już włączona.
    Lewy przycisk przełącza niebieski, zielony, żółty, fioletowy, cyjan i magenta.
    Kolejność lewego przycisku jest trzymana w input_number, bo część lampek
    (w tym KAJPLATS) zgłasza nasycenie bliskie bieli i z samego odczytu
    nie da się poznać, który kolor był poprzedni.
    Sama temperatura barwowa albo sam kolor HS dostaje ten sam układ,
    wyrażony w trybie, który lampka obsługuje.
    Aktualna barwa prawego przycisku jest odczytywana ze wskazanej lampy wzorcowej.
  domain: automation
  author: Paweł
  source_url: https://github.com/rotherpawel/homeassistant-components/blob/main/blueprints/ikea_e2313_styrbar.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices:
      name: Urządzenia
      icon: mdi:remote
      input:
        remote:
          name: Pilot STYRBAR E2313
          description: >
            Pilot IKEA STYRBAR dodany przez Zigbee2MQTT.
            Wyzwalacze to akcje MQTT tego urządzenia.
          selector:
            device:
              filter:
                - integration: mqtt
                  manufacturer: IKEA
                  model: STYRBAR remote control
        lights:
          name: Lampki
          description: >
            Dowolne lampki, grupa, urządzenie albo obszar. Encje muszą obsługiwać
            natężenie oraz barwę (temperaturę barwową, kolor, albo oba).
          selector:
            target:
              entity:
                domain: light
        color_light:
          name: Lampa wzorcowa barwy
          description: >
            Encja, z której odczytywana jest aktualna barwa przed skokiem.
            Wskaż grupę albo jedną z lampek objętych sterowaniem.
          selector:
            entity:
              domain: light
        left_color_index:
          name: Indeks koloru lewego przycisku
          description: >
            Helper input_number od 0 do 5, krok 1. Blueprint zapisuje w nim,
            który kolor lewego przycisku jest następny.
          selector:
            entity:
              domain: input_number
    dimming:
      name: Natężenie
      icon: mdi:brightness-6
      input:
        brightness_step:
          name: Skok natężenia
          description: O ile procent zmieniać jasność przy każdym kroku przytrzymania.
          default: 10
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: "%"
              mode: slider
        step_interval:
          name: Odstęp między krokami
          description: Co ile milisekund wykonywać kolejny skok, dopóki przycisk jest przytrzymany.
          default: 250
          selector:
            number:
              min: 50
              max: 2000
              step: 50
              unit_of_measurement: ms
              mode: box

mode: restart
max_exceeded: silent

variables:
  color_light: !input color_light
  left_color_index_entity: !input left_color_index
  brightness_step: !input brightness_step
  step_interval_ms: !input step_interval
  max_steps: "{{ (100 / (brightness_step | float(10))) | round(0, 'ceil') | int + 1 }}"

triggers:
  - trigger: device
    device_id: !input remote
    domain: mqtt
    type: action
    subtype: "on"
    id: "on"
  - trigger: device
    device_id: !input remote
    domain: mqtt
    type: action
    subtype: "off"
    id: "off"
  - trigger: device
    device_id: !input remote
    domain: mqtt
    type: action
    subtype: brightness_move_up
    id: dim_up
  - trigger: device
    device_id: !input remote
    domain: mqtt
    type: action
    subtype: brightness_move_down
    id: dim_down
  - trigger: device
    device_id: !input remote
    domain: mqtt
    type: action
    subtype: brightness_stop
    id: dim_stop
  - trigger: device
    device_id: !input remote
    domain: mqtt
    type: action
    subtype: arrow_right_click
    id: color_right
  - trigger: device
    device_id: !input remote
    domain: mqtt
    type: action
    subtype: arrow_left_click
    id: color_left

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "on"
        sequence:
          - action: light.turn_on
            target: !input lights

      - conditions:
          - condition: trigger
            id: "off"
        sequence:
          - action: light.turn_off
            target: !input lights

      - conditions:
          - condition: trigger
            id: dim_up
        sequence:
          - repeat:
              count: "{{ max_steps | int }}"
              sequence:
                - action: light.turn_on
                  target: !input lights
                  data:
                    brightness_step_pct: "{{ brightness_step | int }}"
                - delay:
                    milliseconds: "{{ step_interval_ms | int }}"

      - conditions:
          - condition: trigger
            id: dim_down
        sequence:
          - repeat:
              count: "{{ max_steps | int }}"
              sequence:
                - if:
                    - condition: template
                      value_template: >
                        {{ is_state(color_light, 'on') }}
                  then:
                    - action: light.turn_on
                      target: !input lights
                      data:
                        brightness_step_pct: "{{ (brightness_step | int) * -1 }}"
                    - delay:
                        milliseconds: "{{ step_interval_ms | int }}"

      - conditions:
          - condition: trigger
            id: dim_stop
        sequence:
          - stop: "Puszczenie przycisku kończy zmianę natężenia"

      - conditions:
          - condition: trigger
            id: color_right
        sequence:
          - if:
              - condition: state
                entity_id: !input color_light
                state: "on"
            then:
              - variables:
                  color_step: >
                    {% set modes = state_attr(color_light, 'supported_color_modes') or [] %}
                    {% set has_ct = 'color_temp' in modes %}
                    {% set has_hs = 'hs' in modes or 'xy' in modes or 'rgb' in modes or 'rgbw' in modes or 'rgbww' in modes %}
                    {% set mode = state_attr(color_light, 'color_mode') %}
                    {% set hs = state_attr(color_light, 'hs_color') %}
                    {% set kelvin = state_attr(color_light, 'color_temp_kelvin') | float(0) %}
                    {% set hue = hs[0] | float(-1) if hs else -1 %}
                    {% set sat = hs[1] | float(0) if hs else 0 %}
                    {% set is_red = mode == 'hs' and sat > 50 and (hue <= 15 or hue >= 345) %}
                    {% if has_ct and has_hs %}
                      {% if is_red %}
                        {{ 'ct|2600|32|50' }}
                      {% elif mode == 'color_temp' and 0 < kelvin < 3200 %}
                        {{ 'ct|3800|40|12' }}
                      {% elif mode == 'color_temp' and kelvin >= 3200 %}
                        {{ 'hs|2200|0|100' }}
                      {% else %}
                        {{ 'ct|2600|32|50' }}
                      {% endif %}
                    {% elif has_ct %}
                      {% if 0 < kelvin < 3200 %}
                        {{ 'ct|3800|40|12' }}
                      {% elif 3200 <= kelvin < 4500 %}
                        {{ 'ct|5000|200|10' }}
                      {% else %}
                        {{ 'ct|2600|32|50' }}
                      {% endif %}
                    {% else %}
                      {% if is_red %}
                        {{ 'hs|2600|32|50' }}
                      {% elif 20 <= hue <= 55 and 15 <= sat <= 80 %}
                        {{ 'hs|3800|40|12' }}
                      {% elif mode == 'hs' and sat < 25 %}
                        {{ 'hs|2200|0|100' }}
                      {% else %}
                        {{ 'hs|2600|32|50' }}
                      {% endif %}
                    {% endif %}
                  kind: "{{ (color_step | trim).split('|')[0] }}"
                  kelvin: "{{ (color_step | trim).split('|')[1] }}"
                  hue: "{{ (color_step | trim).split('|')[2] }}"
                  sat: "{{ (color_step | trim).split('|')[3] }}"
              - if:
                  - "{{ kind == 'ct' and 'color_temp' in (state_attr(color_light, 'supported_color_modes') or []) }}"
                then:
                  - action: light.turn_on
                    target: !input lights
                    data:
                      color_temp_kelvin: "{{ kelvin | int }}"
                else:
                  - if:
                      - "{{ 'hs' in (state_attr(color_light, 'supported_color_modes') or []) or 'xy' in (state_attr(color_light, 'supported_color_modes') or []) or 'rgb' in (state_attr(color_light, 'supported_color_modes') or []) or 'rgbw' in (state_attr(color_light, 'supported_color_modes') or []) or 'rgbww' in (state_attr(color_light, 'supported_color_modes') or []) }}"
                    then:
                      - action: light.turn_on
                        target: !input lights
                        data:
                          hs_color:
                            - "{{ hue | int }}"
                            - "{{ sat | int }}"
                    else:
                      - action: light.turn_on
                        target: !input lights
                        data:
                          color_temp_kelvin: "{{ kelvin | int }}"

      - conditions:
          - condition: trigger
            id: color_left
        sequence:
          - if:
              - condition: state
                entity_id: !input color_light
                state: "on"
            then:
              - delay:
                  milliseconds: 100
              - variables:
                  color_index: "{{ states(left_color_index_entity) | int(0) % 6 }}"
              - choose:
                  - conditions:
                      - "{{ color_index | int(0) == 0 }}"
                    sequence:
                      - action: light.turn_on
                        target: !input lights
                        data:
                          hs_color:
                            - 240
                            - 100
                  - conditions:
                      - "{{ color_index | int(0) == 1 }}"
                    sequence:
                      - action: light.turn_on
                        target: !input lights
                        data:
                          hs_color:
                            - 120
                            - 100
                  - conditions:
                      - "{{ color_index | int(0) == 2 }}"
                    sequence:
                      - action: light.turn_on
                        target: !input lights
                        data:
                          hs_color:
                            - 60
                            - 100
                  - conditions:
                      - "{{ color_index | int(0) == 3 }}"
                    sequence:
                      - action: light.turn_on
                        target: !input lights
                        data:
                          hs_color:
                            - 280
                            - 100
                  - conditions:
                      - "{{ color_index | int(0) == 4 }}"
                    sequence:
                      - action: light.turn_on
                        target: !input lights
                        data:
                          hs_color:
                            - 180
                            - 100
                default:
                  - action: light.turn_on
                    target: !input lights
                    data:
                      hs_color:
                        - 300
                        - 100
              - action: input_number.set_value
                target:
                  entity_id: !input left_color_index
                data:
                  value: "{{ (color_index | int(0) + 1) % 6 }}"
